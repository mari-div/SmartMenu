{% extends "base.html" %}
{% block titulo %}Mi cuenta · SmartMenu{% endblock %}
{% block contenido %}
<div class="login-wrap">
  <section class="login-card" aria-labelledby="h-cuenta">
    <span class="login-ico"><svg class="ico"><use href="#i-user"/></svg></span>
    <h1 id="h-cuenta">Mi cuenta</h1>
    <p class="muted">{{ usuario.nombre }} · {{ etiqueta_rol }} · usuario <b>{{ usuario.username }}</b></p>

    <form id="form-clave" novalidate>
      <h2 style="font-size:1.15rem; margin-top:1.2rem;">Cambiar contraseña</h2>
      <div class="campo"><label for="c-actual">Contraseña actual</label><input id="c-actual" type="password" autocomplete="current-password" required></div>
      <div class="campo"><label for="c-nueva">Nueva contraseña (mínimo 8 caracteres)</label><input id="c-nueva" type="password" autocomplete="new-password" minlength="8" required></div>
      <div class="campo"><label for="c-repetir">Repite la nueva contraseña</label><input id="c-repetir" type="password" autocomplete="new-password" required></div>
      <p class="error" id="error-clave" role="alert" hidden></p>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Guardar contraseña</button>
    </form>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById("form-clave").addEventListener("submit", async (e) => {
    e.preventDefault();
    const error = document.getElementById("error-clave");
    error.hidden = true;
    const nueva = document.getElementById("c-nueva").value;
    if (nueva !== document.getElementById("c-repetir").value) {
      error.textContent = "Las contraseñas nuevas no coinciden"; error.hidden = false; return;
    }
    const r = await fetch("/api/cuenta/clave", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ actual: document.getElementById("c-actual").value, nueva }) });
    const d = await r.json();
    if (!r.ok) { error.textContent = d.error; error.hidden = false; return; }
    SM.toast("Contraseña actualizada", "ok");
    e.target.reset();
  });
</script>
{% endblock %}
